{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система учёта договоров{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="container py-3">
        <img src="{% static 'homepage/img/logo.png' %}"
             alt="Система учёта договоров"
             class="project-logo">
        {% include "includes/navigation.html" %}
    </header>

    <main class="container flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-muted">
        <p>© <span id="current-year"></span> Система учёта договоров</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
