{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система учёта договоров{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'homepage:index' %}">Contractly<span>.</span></a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container flex-grow-1 content">
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-4 mb-3 text-muted">
        <p>© <span id="current-year"></span> Система учёта договоров</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
